# Backup keep-alive. Render's free plan sleeps after 15 idle minutes. The main pinger is a
# Supabase pg_cron job ("homeworkhatch-keepalive", every 5 minutes via pg_net): GitHub runs
# scheduled workflows hours late, so this one alone doesn't keep the site awake.
name: Keep alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://homeworkhatch.onrender.com/health/db
