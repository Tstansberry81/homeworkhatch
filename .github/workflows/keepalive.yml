# Render's free plan sleeps after 15 idle minutes (the first visit then takes up to a minute,
# and link checkers like the Chrome Web Store's give up), and Supabase's free plan pauses a
# project after a week without activity. A ping every 10 minutes keeps both awake.
name: Keep alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://homeworkhatch.onrender.com/health/db
