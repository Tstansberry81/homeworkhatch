{% extends "base.html" %}
{% block title %}Create your account{% endblock %}
{% block public %}
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/" style="justify-content:center"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt=""> Homework Hatch</a>
    <div class="card">
      <h1>Create your account</h1>
      {% include "_flashes.html" %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="timezone" data-timezone>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" autocomplete="email" required>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ form.get('username', '') }}" autocomplete="username" pattern="[A-Za-z0-9_.\-]{3,30}" required>
        <label for="password">Password <span class="hint">(8+ characters)</span></label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <label class="check"><input type="checkbox" name="terms" required> I'm 13 or older and agree to the <a href="{{ url_for('main.terms') }}" target="_blank">Terms</a> and <a href="{{ url_for('main.privacy') }}" target="_blank">Privacy Policy</a>. If I'm under 18, a parent or guardian has agreed too.</label>
        <button class="btn btn-block mt" type="submit">Create account</button>
      </form>
      <p class="small muted mt">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
