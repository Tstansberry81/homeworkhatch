{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% macro body() %}
<div class="card center" style="max-width:460px;margin:60px auto">
  <div style="font-size:2.6rem">🐣</div>
  <h1>{{ code }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="/">Go home</a>
</div>
{% endmacro %}
{% block content %}{{ body() }}{% endblock %}
{% block public %}<div style="padding:16px">{{ body() }}</div>{% endblock %}
