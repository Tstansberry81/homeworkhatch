{# Exam countdown + readiness ring: "Calc Midterm 2 · Thu · 64% ready". Needs `exam` from study._exam_badge. #}
{% if exam %}
<div class="exam-ring" role="img" aria-label="{{ exam.title }}: exam {{ exam.when|lower }}, {{ exam.ready }}% ready">
  <svg viewBox="0 0 36 36" width="52" height="52" aria-hidden="true">
    <circle class="ring-track" cx="18" cy="18" r="15.915"></circle>
    {% if exam.ready %}<circle class="ring-fill" cx="18" cy="18" r="15.915" stroke-dasharray="{{ exam.ready }} 100"></circle>{% endif %}
    <text x="18" y="21.5" text-anchor="middle">{{ exam.ready }}%</text>
  </svg>
  <div><strong>{{ exam.title }}</strong><div class="small muted">{{ exam.when }} · {{ exam.ready }}% ready</div></div>
</div>
{% endif %}
