# Render Blueprint for Homework Hatch: one Python web service. Database and file storage
# live in Supabase (Postgres + Storage). Deploy with render.com -> New -> Blueprint.
# Secrets use `sync: false`: Render asks for them once when the Blueprint is created and
# they never live in git. Python version comes from .python-version.
services:
  - type: web
    name: homeworkhatch
    runtime: python
    region: ohio
    plan: free  # free sleeps after 15 min idle; a paid plan can move migrations to preDeployCommand
    # Deploy only after the GitHub Actions CI checks on the commit pass.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    # Free instances can't run preDeployCommand, so migrations run on start (single instance, idempotent).
    startCommand: python -m app.boot && exec gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: HH_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEYS
        sync: false  # "k1:<base64>" from `flask encryption new-key k1`; keep a copy in a password manager
      - key: ENCRYPTION_STRICT
        value: "0"  # set to 1 once Admin says everything stored is encrypted
      - key: ADMIN_EMAIL
        sync: false  # the account registered with this email becomes admin
      - key: REQUIRE_APPROVAL
        value: "1"  # new sign-ups wait for an admin; set 0 to open registration
      # Supabase -> Connect -> Session pooler (IPv4; Render can't reach Supabase's IPv6-only
      # direct host). Looks like:
      # postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Supabase Storage (S3 protocol). Storage -> Settings -> S3 connection: enable it and
      # create an access key; create a PRIVATE bucket (e.g. canvas-files).
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false  # https://<ref>.supabase.co
      - key: SUPABASE_BUCKET
        value: canvas-files
      - key: SUPABASE_S3_REGION
        sync: false  # shown on the S3 connection page, e.g. us-east-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false  # Google Calendar + Drive; hidden without it
      - key: PUBLIC_URL
        sync: false  # e.g. https://homeworkhatch.onrender.com (defaults to Render's URL)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PASS
        sync: false  # one-time $20 Semester Pass price
      - key: STRIPE_PRICE_PLUS
        sync: false  # recurring $6/month Plus price
