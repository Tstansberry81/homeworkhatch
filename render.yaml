# Render Blueprint: a web service + Postgres. Deploy via "New > Blueprint" on render.com.
# Python version comes from .python-version.
services:
  - type: web
    name: homeworkhatch
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --workers 2 --threads 8 --worker-class gthread --timeout 180
    healthCheckPath: /health
    envVars:
      - key: HH_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: homeworkhatch-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false  # e.g. https://homeworkhatch.onrender.com or your domain
      - key: ANTHROPIC_API_KEY
        sync: false
      # File storage: Render's disk is wiped on deploy, so use S3/R2 in production.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false  # e.g. https://<account>.r2.cloudflarestorage.com for Cloudflare R2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_NORMAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: COLLEGE_SCORECARD_API_KEY
        sync: false

databases:
  - name: homeworkhatch-db
    plan: basic-256mb
